<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guia local</title>
    <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
    <link rel="stylesheet" href="css/mapa.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="" defer></script>
    <script src="js/mapa.js" defer></script>
</head>
<body>
    <h1>Guia de estabelecimentos locais</h1>
    <nav>
        <a href="index.html">Início</a> |
        <a href="cadastro.html">Cadastro</a>
    </nav>

    <main class="painel">
        <aside>
            <h2>Estabelecimentos</h2>
            <p>
                <label for="pesquisa">Pesquisar por nome</label><br>
                <input type="search" id="pesquisa">
            </p>
            <p>
                <label for="categoria">Categoria</label><br>
                <select id="categoria">
                    <option value="">Todas</option>
                </select>
            </p>
            <button type="button" id="buscar-area">Buscar nesta área</button>
            <p id="mensagem" role="status"></p>
            <ul id="estabelecimentos"></ul>
        </aside>
        <div id="mapa" aria-label="Mapa dos estabelecimentos"></div>
    </main>
</body>
</html>
