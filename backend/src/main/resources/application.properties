spring.application.name=guia-estabelecimentos
server.port=${PORT:8080}


spring.web.resources.static-locations=file:../frontend/,file:frontend/
# O navegador precisa revalidar os arquivos estáticos antes de reutilizá-los.
spring.web.resources.cache.cachecontrol.no-cache=true

spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.connection-init-sql=SET search_path TO public, extensions

# A tabela já foi criada pelo script SQL. O JPA não deve alterar o banco.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
